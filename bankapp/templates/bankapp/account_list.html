<h2>Account List</h2>

<a href="/add/">Add Account</a>

<table border="1">
<tr>
<th>Name</th>
<th>Account Number</th>
<th>Balance</th>
<th>Action</th>
</tr>

{% for a in accounts %}
<tr>
<td>{{a.name}}</td>
<td>{{a.account_number}}</td>
<td>{{a.balance}}</td>
<td>
<a href="/update/{{a.id}}">Edit</a>
<a href="/delete/{{a.id}}">Delete</a>
</td>
</tr>
{% endfor %}

</table>
